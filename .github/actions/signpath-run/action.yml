name: Run inside the GitHub artifact context
description: Keep the Actions artifact credentials available to the packaging process.
inputs:
  policy:
    required: true
    description: Signing policy
  api-token:
    required: false
    description: SignPath CI token
  certificate-thumbprint:
    required: false
    description: Expected production signing certificate
  script:
    required: true
    description: PowerShell script to execute
runs:
  using: node24
  main: ../../../eng/signpath/run.cjs
