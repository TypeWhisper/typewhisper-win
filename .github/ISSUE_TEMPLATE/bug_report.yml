name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check whether the latest release already fixes the problem. A support report from
        **Settings > Advanced > Support diagnostics > Export support report** helps a lot.
        It contains app, device, plugin and workflow metadata, but no audio, transcripts,
        prompts or credentials; see the
        [privacy policy](https://github.com/TypeWhisper/typewhisper-win/blob/main/docs/PRIVACY.md)
        for what it includes.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open TypeWhisper
        2. Go to ...
        3. Click on ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows Version
      placeholder: "e.g. Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: TypeWhisper Version
      placeholder: "e.g. 1.0.9 or 1.1.0-daily.20261007.70"
    validations:
      required: true
  - type: dropdown
    id: install-channel
    attributes:
      label: Install Channel
      description: How did you install this build?
      options:
        - Setup installer
        - Portable ZIP
        - Microsoft Store
        - Daily prerelease
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      description: x64 on most PCs; ARM64 on Snapdragon and other Arm devices.
      options:
        - x64
        - ARM64
  - type: input
    id: transcription-plugin
    attributes:
      label: Transcription Plugin and Model
      placeholder: "e.g. NVIDIA Parakeet, parakeet-tdt-0.6b-v3"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant log output or error details, or attach the exported support report.
      render: shell
