version: 2
updates:
  # Workflows and the local composite actions pin actions by commit; updates move the pin and its version comment.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "(chore) "
    groups:
      github-actions:
        patterns:
          - "*"

  # Directory.Packages.props at the root is the single NuGet manifest (Central Package
  # Management). Minor and patch updates arrive as one grouped PR; majors stay separate.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "(chore) "
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
