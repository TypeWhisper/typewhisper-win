name: Release plugins

on:
  workflow_dispatch:
    inputs:
      plugin_name:
        description: 'Plugin ID suffix, for example file-memory (com.typewhisper.file-memory)'
        required: true
        type: string
      plugin_version:
        description: 'Plugin version from its committed manifest, for example 1.4.0'
        required: true
        type: string
      publish:
        description: 'Publish the tested package and update the catalog (main only)'
        default: false
        type: boolean
  push:
    tags:
      - 'plugin-*-v*'

permissions:
  contents: read

concurrency:
  group: plugin-release-gh-pages
  cancel-in-progress: false
  queue: max

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Test release safety
        run: python -m unittest discover -s eng/tests -p 'test_*.py' -v
      - name: Build and test the selected package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('plugin-{0}-v{1}', inputs.plugin_name, inputs.plugin_version) }}
        run: |
          $arguments = @('eng/Prepare-PluginRelease.py', '--source', $env:GITHUB_WORKSPACE,
            '--output', "$env:RUNNER_TEMP/plugin-release", '--tag', $env:RELEASE_TAG)
          if ($env:GITHUB_EVENT_NAME -eq 'push') { $arguments += '--require-main' }
          python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: plugin-release
          path: ${{ runner.temp }}/plugin-release/
          if-no-files-found: error

  publish:
    needs: package
    if: github.event_name == 'push' || (github.ref == 'refs/heads/main' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-release
          path: ${{ runner.temp }}/plugin-release
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Publish the verified package and refresh the catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python eng/Publish-PluginCatalog.py --stage "$RUNNER_TEMP/plugin-release" --publish
