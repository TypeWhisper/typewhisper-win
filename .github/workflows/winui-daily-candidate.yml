name: Candidate

# PR runs only validate. Publishing is restricted to scheduled Daily runs and explicit runs on main, or for RC and
# Stable on a release/<major>.<minor> branch.
# Daily also ships the separate early 1.1 Daily installation. RC and Stable ship only the original
# TypeWhisper installation, on the feeds its 1.0 updater reads (win-x64-rc and win-x64).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        default: daily
        options:
          - daily
          - rc
          - stable
      version:
        description: 'RC or Stable version, e.g. 1.1.0-rc.1 or 1.1.0 (leave empty for Daily)'
        type: string
        default: ''
      publish:
        description: 'Publish after validation (Daily from main; RC and Stable from main or release/X.Y)'
        type: boolean
        default: false
      publish_legacy_daily:
        description: 'Daily only: also publish the verified 1.0 Daily upgrade (original TypeWhisper installation)'
        type: boolean
        default: false
      signing_policy:
        description: 'Signing policy (test-signing is never published)'
        type: choice
        default: none
        options:
          - none
          - test-signing
          - release-signing
  schedule:
    - cron: '0 4 * * *'
  pull_request:
    paths:
      - '.github/workflows/winui-daily-candidate.yml'
      - 'eng/Test-WinUIDailyCandidate*.ps1'
      - 'eng/Test-DailyUpgradePackage*.ps1'
      - 'eng/Build-WinUIDailyPackages.ps1'
      - 'eng/signpath/**'
      - '.github/actions/signpath*/**'

permissions:
  contents: read

# Daily versions and tags share this prefix; the release job uses it to find the previous Daily.
env:
  DAILY_VERSION_PREFIX: 1.1.0-daily.

concurrency:
  group: winui-daily-candidate-${{ github.ref }}-${{ inputs.channel || 'daily' }}
  # Superseded pull request runs are cancelled; a run on main may be about to publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
      channel: ${{ steps.version.outputs.channel }}
      signing_policy: ${{ steps.signing.outputs.policy }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: docs/releases
      - name: Resolve channel and version
        id: version
        env:
          CHANNEL: ${{ inputs.channel || 'daily' }}
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          PUBLISH_LEGACY_DAILY: ${{ inputs.publish_legacy_daily }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            daily)
              if [ -n "$REQUESTED_VERSION" ]; then echo 'Daily versions are generated; leave the version empty.'; exit 1; fi
              version="${DAILY_VERSION_PREFIX}$(date -u +%Y%m%d).${{ github.run_number }}" ;;
            rc)
              if ! [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then echo 'An RC version looks like 1.1.0-rc.1.'; exit 1; fi
              version="$REQUESTED_VERSION" ;;
            stable)
              if ! [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo 'A Stable version looks like 1.1.0.'; exit 1; fi
              version="$REQUESTED_VERSION" ;;
            *) echo 'Unknown channel.'; exit 1 ;;
          esac
          # Publishing needs main or a release/X.Y branch; the release job only checks the prefix.
          if { [ "$PUBLISH" = true ] || [ "$PUBLISH_LEGACY_DAILY" = true ]; } && [ "$GITHUB_REF" != refs/heads/main ] &&
            ! [[ "$GITHUB_REF" =~ ^refs/heads/release/[0-9]+\.[0-9]+$ ]]; then
            echo 'Releases are published from main or a release/X.Y branch.'; exit 1
          fi
          # Dailies come from main only. A release/X.Y branch publishes RC and Stable versions of its own X.Y line.
          if [ "$CHANNEL" = daily ] && [ "$GITHUB_REF" != refs/heads/main ] && { [ "$PUBLISH" = true ] || [ "$PUBLISH_LEGACY_DAILY" = true ]; }; then
            echo 'Dailies are published from main only.'; exit 1
          fi
          if [[ "$GITHUB_REF" =~ ^refs/heads/release/([0-9]+\.[0-9]+)$ ]] && [ "$CHANNEL" != daily ] && [[ "$version" != "${BASH_REMATCH[1]}".* ]]; then
            echo "A ${BASH_REMATCH[1]} release branch only publishes ${BASH_REMATCH[1]}.x versions."; exit 1
          fi
          if [ "$CHANNEL" != daily ]; then
            if [ "$PUBLISH_LEGACY_DAILY" = true ]; then echo 'The 1.0 Daily upgrade is published only with Daily.'; exit 1; fi
            # gh release create would attach to an existing tag instead of failing.
            set +e; git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; status=$?; set -e
            if [ "$status" -eq 0 ]; then echo "Tag v$version already exists."; exit 1; fi
            if [ "$status" -ne 2 ]; then echo 'Could not check existing tags.'; exit 1; fi
            if [ "$PUBLISH" = true ] && [ ! -f "docs/releases/v$version.md" ]; then
              echo "Add the release notes docs/releases/v$version.md before publishing."; exit 1
            fi
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Resolve signing policy
        id: signing
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_POLICY: ${{ inputs.signing_policy || 'none' }}
          RELEASE_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY || 'none' }}
          PUBLISH_REQUESTED: ${{ inputs.publish || inputs.publish_legacy_daily }}
        run: |
          set -euo pipefail
          policy=none
          if [ "$EVENT_NAME" = workflow_dispatch ]; then policy="$REQUESTED_POLICY"; fi
          if [ "$EVENT_NAME" = schedule ]; then policy="$RELEASE_POLICY"; fi
          case "$policy" in none|test-signing|release-signing) ;; *) echo 'Invalid signing policy'; exit 1;; esac
          if [ "$policy" = test-signing ] && { [ "$EVENT_NAME" != workflow_dispatch ] || [ "$PUBLISH_REQUESTED" = true ]; }; then
            echo 'Test-signed artifacts must not be published.'; exit 1
          fi
          if [ "$policy" != none ] && [ "$GITHUB_REF" != refs/heads/main ] && ! [[ "$GITHUB_REF" =~ ^refs/heads/release/[0-9]+\.[0-9]+$ ]]; then
            echo 'Signing is restricted to main and release/X.Y through the signpath environment.'; exit 1
          fi
          if [ "$RELEASE_POLICY" = release-signing ] && [ "$PUBLISH_REQUESTED" = true ] && [ "$policy" != release-signing ]; then
            echo 'Public releases require production signing once enabled.'; exit 1
          fi
          echo "policy=$policy" >> "$GITHUB_OUTPUT"
  candidate:
    needs: version
    # The signpath environment holds the only token copy and permits only the branches in its deployment rules.
    # GitHub enforces that branch rule even if a PR changes this workflow.
    environment: ${{ needs.version.outputs.signing_policy == 'none' && 'unsigned-candidate' || 'signpath' }}
    env:
      CANDIDATE_VERSION: ${{ needs.version.outputs.value }}
      CANDIDATE_CHANNEL: ${{ needs.version.outputs.channel }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
            framework: net10.0-x64-runtime
    steps:
      - uses: actions/checkout@v7
      - name: Test signing integration safeguards
        shell: pwsh
        run: |
          node --test eng/signpath/sign.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./eng/signpath/Verify-Signatures.Tests.ps1
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            Directory.Packages.props
      - name: Test portable host and application logic
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./eng/Test-WinUIHeadless.ps1 -Configuration Release
      - name: Publish WinUI with shared .NET and bundled CLI
        shell: pwsh
        run: |
          dotnet publish src/TypeWhisper.WinUI/TypeWhisper.WinUI.csproj `
            -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} `
            -p:Version=$env:CANDIDATE_VERSION --self-contained false `
            -p:WindowsAppSDKSelfContained=true -o candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test candidate rejection checks
        shell: pwsh
        run: |
          ./eng/Test-WinUIDailyCandidate.Tests.ps1
          ./eng/Test-DailyUpgradePackage.Tests.ps1
      - name: Validate candidate contents
        shell: pwsh
        run: |
          ./eng/Test-WinUIDailyCandidate.ps1 -PublishDirectory candidate `
            -ExpectedVersion $env:CANDIDATE_VERSION -RuntimeIdentifier '${{ matrix.rid }}' -Channel $env:CANDIDATE_CHANNEL
      - name: Install Velopack
        shell: pwsh
        run: |
          $version = ./eng/Get-CentralPackageVersion.ps1 -PackageId Velopack
          dotnet tool install vpk --version $version --tool-path tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and sign packages
        uses: ./.github/actions/signpath
        env:
          SIGNPATH_GITHUB_TOKEN: ${{ github.token }}
        with:
          policy: ${{ needs.version.outputs.signing_policy }}
          # Avoid passing credentials to unsigned runs; the environment provides
          # the trust boundary, not this PR-editable expression.
          api-token: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && (needs.version.outputs.signing_policy == 'test-signing' || needs.version.outputs.signing_policy == 'release-signing') && secrets.SIGNPATH_API_TOKEN || '' }}
          certificate-thumbprint: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
          script: |
            ./eng/Build-WinUIDailyPackages.ps1 -Version $env:CANDIDATE_VERSION `
              -RuntimeIdentifier '${{ matrix.rid }}' -Framework '${{ matrix.framework }}' -Channel $env:CANDIDATE_CHANNEL
      - name: Read the minimum Windows build from the project
        id: platform
        shell: pwsh
        run: |
          $minimum = (dotnet msbuild src/TypeWhisper.WinUI/TypeWhisper.WinUI.csproj -nologo -getProperty:TargetPlatformMinVersion).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $minimum) { throw 'Could not resolve TargetPlatformMinVersion.' }
          $build = ([version]$minimum).Build
          if ($build -le 0) { throw "Unexpected TargetPlatformMinVersion '$minimum'." }
          Write-Host "TargetPlatformMinVersion $minimum -> minimum Windows build $build"
          "minimum_windows_build=$build" >> $env:GITHUB_OUTPUT
      - name: Archive candidate and record provenance
        shell: pwsh
        env:
          MINIMUM_WINDOWS_BUILD: ${{ steps.platform.outputs.minimum_windows_build }}
        run: |
          New-Item -ItemType Directory artifacts/candidate -Force | Out-Null
          $name = "TypeWhisper-$env:CANDIDATE_VERSION-${{ matrix.rid }}-candidate"
          @{ version = $env:CANDIDATE_VERSION; commit = '${{ github.sha }}'; runtime = '${{ matrix.rid }}';
             minimumWindowsBuild = [int]$env:MINIMUM_WINDOWS_BUILD; profile = 'TypeWhisper-WinUI';
             distribution = "$env:CANDIDATE_CHANNEL-candidate"; automaticUpdates = $false;
             signingPolicy = '${{ needs.version.outputs.signing_policy }}' } |
            ConvertTo-Json | Set-Content "artifacts/candidate/$name.json"
          Compress-Archive -Path candidate/* -DestinationPath "artifacts/candidate/$name.zip"
          Copy-Item installer/* artifacts/candidate/
          # Only Daily builds the original installation separately; RC and Stable ship it as the installer.
          if (Test-Path legacy-installer) { Copy-Item legacy-installer artifacts/candidate/legacy-upgrade -Recurse }
          Get-ChildItem artifacts/candidate -File -Recurse | Where-Object Extension -In '.exe', '.nupkg' | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Set-Content ($_.FullName + '.sha256')
          }
          (Get-FileHash "artifacts/candidate/$name.zip" -Algorithm SHA256).Hash |
            Set-Content "artifacts/candidate/$name.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: winui-daily-candidate-${{ matrix.rid }}
          path: artifacts/candidate/*
          if-no-files-found: error

  release:
    needs: [version, candidate]
    if: needs.version.outputs.signing_policy != 'test-signing' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: winui-daily-candidate-*
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.value }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          PUBLISH_LEGACY_DAILY: ${{ inputs.publish_legacy_daily || vars.LEGACY_DAILY_UPGRADE_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          # Each channel ships exactly its own feeds; any other feed would update the wrong installations.
          case "$CHANNEL" in
            daily) expected='releases.win-x64-winui-daily.json' ;;
            rc) expected='releases.win-x64-rc.json' ;;
            stable) expected='releases.win-x64.json' ;;
            *) echo 'Unknown channel.'; exit 1 ;;
          esac
          actual="$(cd artifacts && ls releases.*.json | sort | paste -sd ' ' -)"
          if [ "$actual" != "$expected" ]; then echo "Unexpected feeds: $actual"; exit 1; fi
          mkdir upload
          for file in artifacts/*; do
            if [ -f "$file" ]; then cp "$file" upload/; fi
          done
          if [ "$CHANNEL" = daily ] && [ "$PUBLISH_LEGACY_DAILY" = "true" ]; then
            cp artifacts/legacy-upgrade/* upload/
            test -f upload/releases.win-x64-daily.json
          fi
          case "$CHANNEL" in
            daily)
              # Notes: the channel introduction, then GitHub's generated list of changes since the previous Daily.
              previous_tag="$(gh release list --exclude-drafts --limit 100 --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[].tagName' \
                | awk -v prefix="v${DAILY_VERSION_PREFIX}" -v current="$TAG" \
                    'index($0, prefix) == 1 && $0 != current && !found { print; found = 1 }')"
              notes_args=(--notes-file docs/releases/1.1-daily.md --generate-notes)
              if [ -n "$previous_tag" ]; then
                echo "Generating release notes since $previous_tag"
                notes_args+=(--notes-start-tag "$previous_tag")
              fi
              title="TypeWhisper $TAG · Daily"
              flags=(--prerelease --latest=false) ;;
            rc)
              notes_args=(--notes-file "docs/releases/$TAG.md")
              title="TypeWhisper $TAG · Release Candidate"
              flags=(--prerelease --latest=false) ;;
            stable)
              # Without the prerelease flag, 1.0 installations on Stable find this release and update.
              notes_args=(--notes-file "docs/releases/$TAG.md")
              title="TypeWhisper $TAG"
              flags=(--latest) ;;
          esac
          # Assets upload to a draft first, so updaters never see a release with missing files.
          gh release create "$TAG" upload/* --target "$GITHUB_SHA" \
            --title "$title" "${notes_args[@]}" "${flags[@]}" --draft
          gh release edit "$TAG" --draft=false "${flags[@]}"

