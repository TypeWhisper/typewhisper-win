name: Candidate

# PR runs only validate. Publishing is restricted to scheduled or explicit main runs.
on:
  workflow_dispatch:
    inputs:
      publish_daily:
        description: 'Publish a WinUI Daily prerelease from main after validation'
        type: boolean
        default: false
      publish_legacy_daily:
        description: 'Also publish the verified 1.0 Daily upgrade (original TypeWhisper installation)'
        type: boolean
        default: false
      signing_policy:
        description: 'Signing policy (test-signing is never published)'
        type: choice
        default: none
        options:
          - none
          - test-signing
          - release-signing
  schedule:
    - cron: '0 4 * * *'
  pull_request:
    paths:
      - '.github/workflows/winui-daily-candidate.yml'
      - 'eng/Test-WinUIDailyCandidate*.ps1'
      - 'eng/Test-DailyUpgradePackage*.ps1'
      - 'eng/Build-WinUIDailyPackages.ps1'
      - 'eng/signpath/**'
      - '.github/actions/signpath*/**'

permissions:
  contents: read

concurrency:
  group: winui-daily-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
      signing_policy: ${{ steps.signing.outputs.policy }}
    steps:
      - id: version
        run: echo "value=1.1.0-daily.$(date -u +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Resolve signing policy
        id: signing
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_POLICY: ${{ inputs.signing_policy || 'none' }}
          RELEASE_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY || 'none' }}
          PUBLISH_REQUESTED: ${{ inputs.publish_daily || inputs.publish_legacy_daily }}
        run: |
          set -euo pipefail
          policy=none
          if [ "$EVENT_NAME" = workflow_dispatch ]; then policy="$REQUESTED_POLICY"; fi
          if [ "$EVENT_NAME" = schedule ]; then policy="$RELEASE_POLICY"; fi
          case "$policy" in none|test-signing|release-signing) ;; *) echo 'Invalid signing policy'; exit 1;; esac
          if [ "$policy" = test-signing ] && { [ "$EVENT_NAME" != workflow_dispatch ] || [ "$PUBLISH_REQUESTED" = true ]; }; then
            echo 'Test-signed artifacts must not be published.'; exit 1
          fi
          if [ "$policy" = release-signing ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Production signing is restricted to main.'; exit 1
          fi
          if [ "$RELEASE_POLICY" = release-signing ] && [ "$PUBLISH_REQUESTED" = true ] && [ "$policy" != release-signing ]; then
            echo 'Public releases require production signing once enabled.'; exit 1
          fi
          echo "policy=$policy" >> "$GITHUB_OUTPUT"
  candidate:
    needs: version
    env:
      CANDIDATE_VERSION: ${{ needs.version.outputs.value }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
            framework: net10.0-x64-runtime
          - rid: win-arm64
            platform: ARM64
            framework: net10.0-arm64-runtime
    steps:
      - uses: actions/checkout@v7
      - name: Test signing integration safeguards
        shell: pwsh
        run: |
          node --test eng/signpath/sign.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./eng/signpath/Verify-Signatures.Tests.ps1
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test portable host and application logic
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./eng/Test-WinUIHeadless.ps1 -Configuration Release
      - name: Publish WinUI with shared .NET and bundled CLI
        shell: pwsh
        run: |
          dotnet publish src/TypeWhisper.WinUI/TypeWhisper.WinUI.csproj `
            -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} `
            -p:Version=$env:CANDIDATE_VERSION --self-contained false `
            -p:WindowsAppSDKSelfContained=true -o candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test candidate rejection checks
        shell: pwsh
        run: |
          ./eng/Test-WinUIDailyCandidate.Tests.ps1
          ./eng/Test-DailyUpgradePackage.Tests.ps1
      - name: Validate candidate contents
        shell: pwsh
        run: |
          ./eng/Test-WinUIDailyCandidate.ps1 -PublishDirectory candidate `
            -ExpectedVersion $env:CANDIDATE_VERSION -RuntimeIdentifier '${{ matrix.rid }}'
      - name: Install Velopack
        shell: pwsh
        run: |
          dotnet tool install vpk --version 0.0.1298 --tool-path tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and sign Daily packages
        uses: ./.github/actions/signpath
        env:
          SIGNPATH_GITHUB_TOKEN: ${{ github.token }}
        with:
          policy: ${{ needs.version.outputs.signing_policy }}
          # PR-controlled code must never receive the signing credential.
          api-token: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && (needs.version.outputs.signing_policy == 'test-signing' || needs.version.outputs.signing_policy == 'release-signing') && secrets.SIGNPATH_API_TOKEN || '' }}
          certificate-thumbprint: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
          script: |
            ./eng/Build-WinUIDailyPackages.ps1 -Version $env:CANDIDATE_VERSION `
              -RuntimeIdentifier '${{ matrix.rid }}' -Framework '${{ matrix.framework }}'
      - name: Archive candidate and record provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts/candidate -Force | Out-Null
          $name = "TypeWhisper-$env:CANDIDATE_VERSION-${{ matrix.rid }}-candidate"
          @{ version = $env:CANDIDATE_VERSION; commit = '${{ github.sha }}'; runtime = '${{ matrix.rid }}';
             minimumWindowsBuild = 19041; profile = 'TypeWhisper-WinUI';
             distribution = 'daily-candidate'; automaticUpdates = $false;
             signingPolicy = '${{ needs.version.outputs.signing_policy }}' } |
            ConvertTo-Json | Set-Content "artifacts/candidate/$name.json"
          Compress-Archive -Path candidate/* -DestinationPath "artifacts/candidate/$name.zip"
          Copy-Item installer/* artifacts/candidate/
          Copy-Item legacy-installer artifacts/candidate/legacy-upgrade -Recurse
          Get-ChildItem artifacts/candidate -File -Recurse | Where-Object Extension -In '.exe', '.nupkg' | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Set-Content ($_.FullName + '.sha256')
          }
          (Get-FileHash "artifacts/candidate/$name.zip" -Algorithm SHA256).Hash |
            Set-Content "artifacts/candidate/$name.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: winui-daily-candidate-${{ matrix.rid }}
          path: artifacts/candidate/*
          if-no-files-found: error

  release:
    needs: [version, candidate]
    if: needs.version.outputs.signing_policy != 'test-signing' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_daily))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: winui-daily-candidate-*
          path: artifacts
          merge-multiple: true
      - name: Publish Daily prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.value }}
          PUBLISH_LEGACY_DAILY: ${{ inputs.publish_legacy_daily || vars.LEGACY_DAILY_UPGRADE_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          test -f artifacts/releases.win-x64-winui-daily.json
          test -f artifacts/releases.win-arm64-winui-daily.json
          test ! -f artifacts/releases.win-x64-daily.json
          test ! -f artifacts/releases.win-arm64-daily.json
          mkdir upload
          for file in artifacts/*; do
            if [ -f "$file" ]; then cp "$file" upload/; fi
          done
          if [ "$PUBLISH_LEGACY_DAILY" = "true" ]; then
            cp artifacts/legacy-upgrade/* upload/
            test -f upload/releases.win-x64-daily.json
            test -f upload/releases.win-arm64-daily.json
          fi
          gh release create "$TAG" upload/* --target "$GITHUB_SHA" \
            --title "TypeWhisper $TAG · Daily" --notes-file docs/releases/1.1-daily.md \
            --prerelease --latest=false --draft
          gh release edit "$TAG" --draft=false --prerelease --latest=false

