name: Candidate

# PR runs only validate. Publishing is restricted to scheduled or explicit main runs.
on:
  workflow_dispatch:
    inputs:
      publish_daily:
        description: 'Publish a WinUI Daily prerelease from main after validation'
        type: boolean
        default: false
      publish_legacy_daily:
        description: 'Also publish the verified 1.0 Daily upgrade (original TypeWhisper installation)'
        type: boolean
        default: false
  schedule:
    - cron: '0 4 * * *'
  pull_request:
    paths:
      - '.github/workflows/winui-daily-candidate.yml'
      - 'eng/Test-WinUIDailyCandidate*.ps1'
      - 'eng/Test-DailyUpgradePackage*.ps1'

permissions:
  contents: read

# Daily versions and tags share this prefix; the release job uses it to find the previous Daily.
env:
  DAILY_VERSION_PREFIX: 1.1.0-daily.

concurrency:
  group: winui-daily-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        run: echo "value=${DAILY_VERSION_PREFIX}$(date -u +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
  candidate:
    needs: version
    env:
      CANDIDATE_VERSION: ${{ needs.version.outputs.value }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
            framework: net10.0-x64-runtime
          - rid: win-arm64
            platform: ARM64
            framework: net10.0-arm64-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            Directory.Packages.props
      - name: Test portable host and application logic
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./eng/Test-WinUIHeadless.ps1 -Configuration Release
      - name: Publish WinUI with shared .NET and bundled CLI
        shell: pwsh
        run: |
          dotnet publish src/TypeWhisper.WinUI/TypeWhisper.WinUI.csproj `
            -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} `
            -p:Version=$env:CANDIDATE_VERSION --self-contained false `
            -p:WindowsAppSDKSelfContained=true -o candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test candidate rejection checks
        shell: pwsh
        run: |
          ./eng/Test-WinUIDailyCandidate.Tests.ps1
          ./eng/Test-DailyUpgradePackage.Tests.ps1
      - name: Validate candidate contents
        shell: pwsh
        run: |
          ./eng/Test-WinUIDailyCandidate.ps1 -PublishDirectory candidate `
            -ExpectedVersion $env:CANDIDATE_VERSION -RuntimeIdentifier '${{ matrix.rid }}'
      - name: Build side-by-side Daily installer
        shell: pwsh
        run: |
          $version = ./eng/Get-CentralPackageVersion.ps1 -PackageId Velopack
          dotnet tool install vpk --version $version --tool-path tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/vpk.exe pack --packId TypeWhisperDaily --packTitle 'TypeWhisper' `
            --packVersion $env:CANDIDATE_VERSION --packDir candidate `
            --mainExe TypeWhisper.exe --channel '${{ matrix.rid }}-winui-daily' `
            --runtime '${{ matrix.rid }}' --framework '${{ matrix.framework }}' `
            --icon src/TypeWhisper.WinUI/Assets/app.ico `
            --outputDir installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-ChildItem installer -Filter '*Setup.exe')) { throw 'Daily installer is missing.' }
      - name: Build original-installation Daily upgrade
        shell: pwsh
        run: |
          ./tools/vpk.exe pack --packId TypeWhisper --packTitle 'TypeWhisper' `
            --packVersion $env:CANDIDATE_VERSION --packDir candidate `
            --mainExe TypeWhisper.exe --channel '${{ matrix.rid }}-daily' `
            --runtime '${{ matrix.rid }}' --framework '${{ matrix.framework }}' `
            --icon src/TypeWhisper.WinUI/Assets/app.ico --outputDir legacy-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./eng/Test-DailyUpgradePackage.ps1 -ReleaseDirectory legacy-installer -RuntimeIdentifier '${{ matrix.rid }}' -ExpectedVersion $env:CANDIDATE_VERSION
      - name: Read the minimum Windows build from the project
        id: platform
        shell: pwsh
        run: |
          $minimum = (dotnet msbuild src/TypeWhisper.WinUI/TypeWhisper.WinUI.csproj -nologo -getProperty:TargetPlatformMinVersion).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $minimum) { throw 'Could not resolve TargetPlatformMinVersion.' }
          $build = ([version]$minimum).Build
          if ($build -le 0) { throw "Unexpected TargetPlatformMinVersion '$minimum'." }
          Write-Host "TargetPlatformMinVersion $minimum -> minimum Windows build $build"
          "minimum_windows_build=$build" >> $env:GITHUB_OUTPUT
      - name: Archive candidate and record provenance
        shell: pwsh
        env:
          MINIMUM_WINDOWS_BUILD: ${{ steps.platform.outputs.minimum_windows_build }}
        run: |
          New-Item -ItemType Directory artifacts/candidate -Force | Out-Null
          $name = "TypeWhisper-$env:CANDIDATE_VERSION-${{ matrix.rid }}-candidate"
          @{ version = $env:CANDIDATE_VERSION; commit = '${{ github.sha }}'; runtime = '${{ matrix.rid }}';
             minimumWindowsBuild = [int]$env:MINIMUM_WINDOWS_BUILD; profile = 'TypeWhisper-WinUI';
             distribution = 'daily-candidate'; automaticUpdates = $false } |
            ConvertTo-Json | Set-Content "artifacts/candidate/$name.json"
          Compress-Archive -Path candidate/* -DestinationPath "artifacts/candidate/$name.zip"
          Copy-Item installer/* artifacts/candidate/
          Copy-Item legacy-installer artifacts/candidate/legacy-upgrade -Recurse
          Get-ChildItem artifacts/candidate -File -Recurse | Where-Object Extension -In '.exe', '.nupkg' | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Set-Content ($_.FullName + '.sha256')
          }
          (Get-FileHash "artifacts/candidate/$name.zip" -Algorithm SHA256).Hash |
            Set-Content "artifacts/candidate/$name.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: winui-daily-candidate-${{ matrix.rid }}
          path: artifacts/candidate/*
          if-no-files-found: error

  release:
    needs: [version, candidate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_daily))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: winui-daily-candidate-*
          path: artifacts
          merge-multiple: true
      - name: Publish Daily prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.value }}
          PUBLISH_LEGACY_DAILY: ${{ inputs.publish_legacy_daily || vars.LEGACY_DAILY_UPGRADE_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          test -f artifacts/releases.win-x64-winui-daily.json
          test -f artifacts/releases.win-arm64-winui-daily.json
          test ! -f artifacts/releases.win-x64-daily.json
          test ! -f artifacts/releases.win-arm64-daily.json
          mkdir upload
          for file in artifacts/*; do
            if [ -f "$file" ]; then cp "$file" upload/; fi
          done
          if [ "$PUBLISH_LEGACY_DAILY" = "true" ]; then
            cp artifacts/legacy-upgrade/* upload/
            test -f upload/releases.win-x64-daily.json
            test -f upload/releases.win-arm64-daily.json
          fi
          # Notes: the channel introduction, then GitHub's generated list of changes since the previous Daily.
          previous_tag="$(gh release list --exclude-drafts --limit 100 --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[].tagName' \
            | awk -v prefix="v${DAILY_VERSION_PREFIX}" -v current="$TAG" \
                'index($0, prefix) == 1 && $0 != current && !found { print; found = 1 }')"
          notes_args=(--notes-file docs/releases/1.1-daily.md --generate-notes)
          if [ -n "$previous_tag" ]; then
            echo "Generating release notes since $previous_tag"
            notes_args+=(--notes-start-tag "$previous_tag")
          fi
          gh release create "$TAG" upload/* --target "$GITHUB_SHA" \
            --title "TypeWhisper $TAG · Daily" "${notes_args[@]}" \
            --prerelease --latest=false --draft
          gh release edit "$TAG" --draft=false --prerelease --latest=false

