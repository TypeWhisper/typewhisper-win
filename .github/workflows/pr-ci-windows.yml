name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-windows-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request runs are cancelled; every push to main keeps its run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build WinUI
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check changed whitespace
        shell: pwsh
        run: git diff --check HEAD^ HEAD

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            Directory.Packages.props

      - name: Create build log directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path artifacts/logs | Out-Null

      - name: Restore solution
        run: dotnet restore TypeWhisper.slnx

      - name: Build solution
        run: dotnet build TypeWhisper.slnx -c Release --no-restore -bl:artifacts/logs/typewhisper-solution.binlog

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: winui-build-logs
          path: artifacts/logs/*.binlog
          if-no-files-found: ignore

  headless:
    name: App tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          # Hash only the projects this job restores so it keeps its own cache entry.
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj
            Directory.Build.props
            Directory.Packages.props
      - name: Verify headless suite selection and failure reporting
        shell: pwsh
        run: ./eng/Test-WinUIHeadless.Tests.ps1
      - name: Verify dependency notice packaging
        shell: pwsh
        run: ./eng/Write-RuntimeNotices.Tests.ps1
      - name: Verify central package version bindings
        shell: pwsh
        run: ./eng/Get-CentralPackageVersion.Tests.ps1
      - name: Verify MSI product version rules
        shell: pwsh
        run: ./eng/Get-MsiProductVersion.Tests.ps1
      - name: Verify the shared CLI runtime manifest
        shell: pwsh
        run: ./eng/Optimize-CliBundle.Tests.ps1
      - name: Verify Store package version rules
        shell: pwsh
        run: |
          ./eng/Get-StorePackageVersion.Tests.ps1
          ./eng/New-StorePackageManifest.Tests.ps1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify Store beta and Stable submission guards without credentials
        run: python -m unittest discover -s eng/tests -p 'test_store_*_release.py' -v
      - name: Verify public Store beta profile isolation
        shell: pwsh
        run: dotnet test tests/TypeWhisper.Presentation.Tests/TypeWhisper.Presentation.Tests.csproj -c Release -p:DefineConstants=TYPEWHISPER_STORE_BETA --filter 'FullyQualifiedName~WinUIProfileTests|FullyQualifiedName~StoreProfileIsolationTests|FullyQualifiedName~AppImportTests'
      - name: Test application and plugin host without desktop or provider credentials
        shell: pwsh
        run: ./eng/Test-WinUIHeadless.ps1 -Configuration Release -Suite App -CollectCoverage
      - name: Verify audio test orchestration with fake endpoints
        shell: pwsh
        run: ./eng/Test-WinUILocalAudio.Tests.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: winui-headless-${{ matrix.os }}
          path: artifacts/test-results/winui-headless/
          if-no-files-found: warn
