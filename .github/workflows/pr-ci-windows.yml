name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build WinUI
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Create build log directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path artifacts/logs | Out-Null

      - name: Restore solution
        run: dotnet restore TypeWhisper.slnx

      - name: Build solution
        run: dotnet build TypeWhisper.slnx -c Release --no-restore -bl:artifacts/logs/typewhisper-solution.binlog

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: winui-build-logs
          path: artifacts/logs/*.binlog
          if-no-files-found: ignore

  headless:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run without desktop, microphone, models or provider credentials
        shell: pwsh
        run: ./eng/Test-WinUIHeadless.ps1 -Configuration Release
      - name: Verify audio test orchestration with fake endpoints
        shell: pwsh
        run: ./eng/Test-WinUILocalAudio.Tests.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: winui-headless-${{ matrix.os }}
          path: artifacts/test-results/winui-headless/
          if-no-files-found: warn
