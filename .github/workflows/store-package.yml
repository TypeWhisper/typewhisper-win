name: Store
run-name: Store ${{ inputs.destination }} ${{ inputs.version }}

on:
  workflow_call:
    inputs:
      destination:
        type: string
        required: true
      version:
        type: string
        required: true
      source_revision:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      destination:
        description: "Intended submission (packages only; does not publish)"
        type: choice
        required: true
        default: internal-flight
        options:
          - internal-flight
          - public-beta
          - stable
      version:
        description: "New numeric Store version: Major.Minor.Build.0, e.g. 1.1.1.0"
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Store packages always link the optional modules. The premium-modules environment releases the read-only deploy key
  # of the private modules repository only to main, release/* and tags; pull requests never reach this job.
  package:
    name: Build Store MSIX
    if: >-
      github.event_name != 'pull_request' && github.event_name != 'pull_request_target' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/'))
    environment: premium-modules
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64]
    env:
      VERSION: ${{ inputs.version }}
      DESTINATION: ${{ inputs.destination }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_revision || github.sha }}

      - name: Validate version and resolve Store product
        id: meta
        shell: pwsh
        run: |
          if ($env:DESTINATION -notin @('internal-flight', 'public-beta', 'stable')) {
            throw 'Unknown Store submission destination.'
          }
          ./eng/Get-StorePackageVersion.Tests.ps1
          ./eng/New-StorePackageManifest.Tests.ps1
          $version = ./eng/Get-StorePackageVersion.ps1 -Version $env:VERSION
          $product = if ($env:DESTINATION -eq 'public-beta') { 'beta' } else { 'stable' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "product=$product" >> $env:GITHUB_OUTPUT

      # A source from before the optional modules (an older release replayed) has no pin and builds as it did then.
      - name: Read the modules pin
        id: modules
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath eng/Get-ModulesRef.ps1) {
            "supported=true" >> $env:GITHUB_OUTPUT
            "ref=$(./eng/Get-ModulesRef.ps1)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host '::notice::This source predates the optional modules; it is packaged without them.'
            "supported=false" >> $env:GITHUB_OUTPUT
          }

      - name: Check out the optional modules
        if: steps.modules.outputs.supported == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TypeWhisper/typewhisper-premium-win
          ref: ${{ steps.modules.outputs.ref }}
          path: external/typewhisper-premium-win
          ssh-key: ${{ secrets.PREMIUM_WIN_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "11.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            Directory.Packages.props

      - name: Restore solution
        run: dotnet restore TypeWhisper.slnx

      - name: Build solution
        shell: pwsh
        run: dotnet build TypeWhisper.slnx -c Release -p:Version=${{ steps.meta.outputs.version }} -p:TypeWhisperStoreBuild=true -p:TypeWhisperStoreProduct=${{ steps.meta.outputs.product }} ${{ steps.modules.outputs.supported == 'true' && '-p:TypeWhisperRequireModules=true' || '' }} --no-restore

      - name: Build MSIX package
        shell: pwsh
        run: ./eng/Build-StorePackage.ps1 -Version ${{ steps.meta.outputs.version }} -StoreProduct ${{ steps.meta.outputs.product }} -RuntimeIdentifier ${{ matrix.rid }} ${{ steps.modules.outputs.supported == 'true' && '-ExpectedModules premium' || '' }}

      - name: Record package provenance and submission destination
        shell: pwsh
        env:
          STORE_PRODUCT: ${{ steps.meta.outputs.product }}
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
          PACKAGE_RID: ${{ matrix.rid }}
        run: |
          $identity = ./eng/Get-StorePackageIdentity.ps1 -StoreProduct $env:STORE_PRODUCT
          $directory = "artifacts/store/$env:STORE_PRODUCT/packages"
          $package = Get-Item "$directory/TypeWhisper-$env:STORE_PRODUCT-$env:PACKAGE_RID-$env:PACKAGE_VERSION.msix"
          $sha256 = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceRevision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the packaged source revision.' }
          [ordered]@{
            product = $env:STORE_PRODUCT
            destination = $env:DESTINATION
            version = $env:PACKAGE_VERSION
            runtimeIdentifier = $env:PACKAGE_RID
            sourceRevision = $sourceRevision
            modulesRevision = '${{ steps.modules.outputs.ref }}'
            identity = $identity
            package = $package.Name
            sha256 = $sha256
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath "$directory/package-info-$env:PACKAGE_RID.json" -Encoding utf8
          $target = if ($env:DESTINATION -eq 'internal-flight') { 'Internal Beta flight in TypeWhisper' }
            elseif ($env:DESTINATION -eq 'public-beta') { 'TypeWhisper Beta (public audience, direct link only)' }
            else { 'TypeWhisper regular submission' }
          @"
          ## Store package prepared

          - Destination: $target
          - Store ID: $($identity.storeProductId)
          - Package: $($package.Name)
          - Source revision: $sourceRevision
          - SHA-256: $sha256

          This packaging job does not publish or certify the app. Manual runs produce downloadable artifacts; Store Beta Daily validates and submits its artifacts in a separate job.
          "@ >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-msix-${{ inputs.destination }}-${{ steps.meta.outputs.version }}-${{ matrix.rid }}
          path: artifacts/store/${{ steps.meta.outputs.product }}/packages/*
          if-no-files-found: error
