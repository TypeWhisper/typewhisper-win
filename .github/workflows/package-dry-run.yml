name: Packaging

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Velopack release track to validate.'
        required: false
        default: stable
        type: choice
        options:
          - stable
          - rc
          - daily

permissions:
  contents: read

concurrency:
  group: package-dry-run-${{ github.event.pull_request.number || github.ref }}-${{ inputs.channel || 'stable' }}
  # Superseded pull request runs are cancelled; every push to main keeps its run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
            framework: net10.0-x64-runtime

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve dry-run channel
        id: meta
        shell: pwsh
        run: |
          $channel = "${{ inputs.channel || 'stable' }}"
          $date = (Get-Date).ToUniversalTime().ToString("yyyyMMdd")
          $rid = "${{ matrix.rid }}"

          switch ($channel) {
            "rc" {
              $version = "0.0.1-rc.dryrun.${{ github.run_number }}"
              $suffix = "-rc"
            }
            "daily" {
              $version = "0.0.1-daily.$date.${{ github.run_number }}"
              $suffix = "-daily"
            }
            default {
              $version = "0.0.1-dryrun.${{ github.run_number }}"
              $suffix = "-stable"
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "channel_suffix=$suffix" >> $env:GITHUB_OUTPUT
          "velopack_channel=$rid-winui$suffix" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            Directory.Packages.props

      - name: Create artifact directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/logs | Out-Null
          New-Item -ItemType Directory -Force -Path "releases/${{ steps.meta.outputs.velopack_channel }}" | Out-Null

      - name: Publish app
        run: dotnet publish src/TypeWhisper.WinUI/TypeWhisper.WinUI.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -p:Version=${{ steps.meta.outputs.version }} --self-contained false -o publish/${{ matrix.rid }} -bl:artifacts/logs/typewhisper-package.binlog

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          $version = ./eng/Get-CentralPackageVersion.ps1 -PackageId Velopack
          dotnet tool install -g vpk --version $version

      - name: Pack Velopack dry run
        shell: pwsh
        run: |
          vpk pack `
            --packId TypeWhisperDaily `
            --packTitle TypeWhisper `
            --packVersion ${{ steps.meta.outputs.version }} `
            --packDir "publish/${{ matrix.rid }}" `
            --mainExe TypeWhisper.exe `
            --runtime '${{ matrix.rid }}' --framework '${{ matrix.framework }}' `
            --icon src/TypeWhisper.WinUI/Assets/app.ico `
            --channel ${{ steps.meta.outputs.velopack_channel }} `
            --outputDir "releases/${{ steps.meta.outputs.velopack_channel }}"

      - name: Validate portable package
        shell: pwsh
        run: |
          ./eng/Test-PortablePackage.ps1 `
            -ReleaseDirectory "releases/${{ steps.meta.outputs.velopack_channel }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: package-dry-run-${{ steps.meta.outputs.velopack_channel }}
          path: |
            artifacts/logs/*.binlog
            releases/${{ steps.meta.outputs.velopack_channel }}/*
          if-no-files-found: ignore
