name: Package Dry Run

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: 'Velopack release track to validate.'
        required: false
        default: stable
        type: choice
        options:
          - stable
          - rc
          - daily

permissions:
  contents: read

concurrency:
  group: package-dry-run-${{ github.event.pull_request.number || github.ref }}-${{ inputs.channel || 'stable' }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
            framework: net10.0-x64-runtime
          - rid: win-arm64
            platform: ARM64
            framework: net10.0-arm64-runtime

    steps:
      - uses: actions/checkout@v7

      - name: Resolve dry-run channel
        id: meta
        shell: pwsh
        run: |
          $channel = "${{ inputs.channel || 'stable' }}"
          $date = (Get-Date).ToUniversalTime().ToString("yyyyMMdd")
          $rid = "${{ matrix.rid }}"

          switch ($channel) {
            "rc" {
              $version = "0.0.1-rc.dryrun.${{ github.run_number }}"
              $suffix = "-rc"
            }
            "daily" {
              $version = "0.0.1-daily.$date.${{ github.run_number }}"
              $suffix = "-daily"
            }
            default {
              $version = "0.0.1-dryrun.${{ github.run_number }}"
              $suffix = "-stable"
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "channel_suffix=$suffix" >> $env:GITHUB_OUTPUT
          "velopack_channel=$rid-winui$suffix" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Create artifact directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/logs | Out-Null
          New-Item -ItemType Directory -Force -Path "releases/${{ steps.meta.outputs.velopack_channel }}" | Out-Null

      - name: Restore solution
        run: dotnet restore TypeWhisper.slnx

      - name: Build solution
        run: dotnet build TypeWhisper.slnx -c Release --no-restore -p:Version=${{ steps.meta.outputs.version }} -bl:artifacts/logs/typewhisper-package.binlog

      - name: Publish app
        run: dotnet publish src/TypeWhisper.WinUI/TypeWhisper.WinUI.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -p:Version=${{ steps.meta.outputs.version }} --self-contained false -o publish/${{ matrix.rid }}

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 0.0.1298

      - name: Pack Velopack dry run
        shell: pwsh
        run: |
          vpk pack `
            --packId TypeWhisperDaily `
            --packVersion ${{ steps.meta.outputs.version }} `
            --packDir "publish/${{ matrix.rid }}" `
            --mainExe TypeWhisper.WinUI.exe `
            --runtime '${{ matrix.rid }}' --framework '${{ matrix.framework }}' `
            --icon src/TypeWhisper.WinUI/Assets/app.ico `
            --channel ${{ steps.meta.outputs.velopack_channel }} `
            --outputDir "releases/${{ steps.meta.outputs.velopack_channel }}"

      - name: Validate portable package
        shell: pwsh
        run: |
          ./eng/Test-PortablePackage.ps1 `
            -ReleaseDirectory "releases/${{ steps.meta.outputs.velopack_channel }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-dry-run-${{ steps.meta.outputs.velopack_channel }}
          path: |
            artifacts/logs/*.binlog
            releases/${{ steps.meta.outputs.velopack_channel }}/*
          if-no-files-found: ignore
